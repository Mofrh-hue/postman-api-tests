name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # every Monday 07:00 UTC

jobs:
  mock:
    name: Collections vs. offline mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run both collections against the mock API
        run: npm run test:mock

  live:
    name: Collections vs. live Toolshop API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Toolshop API collection
        run: npm run test:api

      - name: Data-driven search collection
        if: always()
        run: npm run test:search

      - name: Upload HTML and JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
          retention-days: 14
